[project]
name = "mocapref"
version = "0.1.0"
description = "Detection and correction of errors in public IMU datasets with an optical motion-capture reference"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "h5py>=3.16.0",
    "dfjimu>=0.4.1",
    "ezc3d>=1.7.2",
    "pyarrow>=26.0.0",
    "openpyxl>=3.1.5",
    "qmt>=0.2.4",
    "numba>=0.68.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocapref"]
